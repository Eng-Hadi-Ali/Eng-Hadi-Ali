name: Refresh public profile metrics

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-metrics
  cancel-in-progress: false

jobs:
  update-public-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate public-only glass dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_profile_stats.py
      - name: Commit refreshed dashboard when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-glass-stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh public glass metrics"
            git push
          fi
