<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="190" viewBox="0 0 1400 190" role="img" aria-labelledby="ribbon-title ribbon-desc">
<title id="ribbon-title">Eng. Hadi Al-Drobi — Professional Expertise</title>
<desc id="ribbon-desc">Original compact layout: three navy glass ribbons on top and Flutter centered beneath. Four original brand-colored identities with sequential typing animations.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020918"/><stop offset=".55" stop-color="#06152C"/><stop offset="1" stop-color="#030C20"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09254A"/><stop offset=".52" stop-color="#06152C"/><stop offset="1" stop-color="#04132A"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#B0E5FA" stop-opacity=".62"/><stop offset="1" stop-color="#B0E5FA" stop-opacity=".05"/></linearGradient>
  <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#37AFFF" stroke-opacity=".07"/></pattern>
  <clipPath id="type-odoo"><rect x="91" y="33" height="33" width="0"><animate attributeName="width" values="0;336;336;0" keyTimes="0;.09;.965;1" dur="66s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="type-finance"><rect x="528" y="33" height="33" width="0"><animate attributeName="width" values="0;0;404;404;0" keyTimes="0;.01;.10;.965;1" dur="66s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="type-python"><rect x="1040" y="33" height="33" width="0"><animate attributeName="width" values="0;0;306;306;0" keyTimes="0;.02;.11;.965;1" dur="66s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="type-flutter"><rect x="587" y="116" height="33" width="0"><animate attributeName="width" values="0;0;276;276;0" keyTimes="0;.03;.12;.965;1" dur="66s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<rect width="1400" height="190" rx="16" fill="url(#bg)"/><path d="M0 161h1400" stroke="#0068BA" stroke-opacity=".32" stroke-width="1.5"/><rect width="1400" height="190" rx="16" fill="url(#grid)"/>
<g fill="url(#glass)" stroke="#137BC9" stroke-width="1.2">
  <rect x="24" y="21" width="420" height="59" rx="12"/>
  <rect x="469" y="21" width="478" height="59" rx="12"/>
  <rect x="972" y="21" width="404" height="59" rx="12"/>
  <rect x="523" y="108" width="354" height="59" rx="12"/>
</g>
<g fill="none" stroke="url(#edge)" stroke-width="1.5"><path d="M39 23H430"/><path d="M484 23H932"/><path d="M987 23H1361"/><path d="M538 110H862"/></g>
<g stroke="#2783C3" stroke-opacity=".4" stroke-width="1"><path d="M199 33V69"/><path d="M643 33V69"/><path d="M1141 33V69"/><path d="M705 120V157"/></g>
<!-- Each logo is rendered in its brand color at full opacity. -->
<!-- Odoo identity: a compact set of interlinked circles, not a third-party image. -->
<g fill="none" stroke="#AD729E" stroke-width="5"><circle cx="47" cy="50" r="9"/><circle cx="66" cy="50" r="9"/></g>
<circle cx="66" cy="50" r="3.5" fill="#AD729E"/>
<!-- Finance identity -->
<g fill="none" stroke="#62C9EC" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="489" y="34" width="24" height="31" rx="4"/><path d="M494 41H508M494 47H508M495 54h3m6 0h3m-12 6h3m6 0h3"/></g>
<!-- Python identity, characteristic blue/yellow icon -->
<g transform="translate(994 33) scale(.6)"><path d="M34 0H18C9 0 8 5 8 14v7h26v5H12C3 26 0 33 0 41s5 12 15 12h8v-11c0-10 7-15 16-15h13V14C52 5 47 0 34 0Z" fill="#3776AB"/><path d="M18 68h16c9 0 10-5 10-14v-7H18v-5h22c9 0 12-7 12-15s-5-12-15-12h-8v11c0 10-7 15-16 15H0v13c0 9 5 14 18 14Z" fill="#FFD43B" transform="translate(8 0)"/><circle cx="18" cy="10" r="3" fill="#F6FBFF"/><circle cx="42" cy="57" r="3" fill="#0B2538"/></g>
<!-- Flutter identity -->
<g transform="translate(544 119)"><path d="M0 20 20 0H36L16 20Z" fill="#54C5F8"/><path d="M0 26 20 6H36L16 26Z" fill="#29B6F6"/><path d="M16 26 27 15 42 30 31 41Z" fill="#01579B"/></g>
<!-- Brand names and descriptors are opaque and animate writing inside clips. -->
<g font-family="Arial,Helvetica,sans-serif" font-weight="700">
 <g clip-path="url(#type-odoo)"><text x="91" y="59" font-size="21" letter-spacing="1.2" fill="#B987AD">ODOO</text><text x="213" y="59" font-size="18" letter-spacing=".8" fill="#B987AD">ERP CONSULTING</text></g>
 <g clip-path="url(#type-finance)"><text x="528" y="59" font-size="20" letter-spacing="1" fill="#66D0F2">FINANCE</text><text x="655" y="59" font-size="19" letter-spacing=".6" fill="#66D0F2">ACCOUNTING &amp; AUDIT</text></g>
 <g clip-path="url(#type-python)"><text x="1040" y="59" font-size="20" letter-spacing="1" fill="#77BDEC">PYTHON</text><text x="1153" y="59" font-size="19" letter-spacing=".6" fill="#77BDEC">DEVELOPMENT</text></g>
 <g clip-path="url(#type-flutter)"><text x="587" y="145" font-size="20" letter-spacing="1" fill="#54C5F8">FLUTTER</text><text x="719" y="145" font-size="18" letter-spacing=".5" fill="#54C5F8">APPLICATIONS</text></g>
</g>
<rect x="4" y="4" width="1392" height="182" rx="12" fill="none" stroke="#087BD0" stroke-opacity=".4" stroke-width="1.5"/>
</svg>