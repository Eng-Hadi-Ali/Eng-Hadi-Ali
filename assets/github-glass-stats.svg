<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="212" viewBox="0 0 1400 212" role="img" aria-labelledby="title description">
<title id="title">Eng. Hadi Al-Drobi — Compact GitHub Engineering Metrics</title>
<desc id="description">Four slim navy digital-glass strips showing public repositories, received stars, followers and latest public push. Data generated from GitHub public API.</desc>
<defs>
 <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020918"/><stop offset=".55" stop-color="#06152C"/><stop offset="1" stop-color="#030C20"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A3160" stop-opacity=".68"/><stop offset=".6" stop-color="#08254D" stop-opacity=".48"/><stop offset="1" stop-color="#030D23" stop-opacity=".82"/></linearGradient>
 <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A7E4FD" stop-opacity=".66"/><stop offset="1" stop-color="#A7E4FD" stop-opacity=".02"/></linearGradient>
 <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#40B9FF" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1400" height="212" rx="16" fill="url(#background)"/><rect width="1400" height="212" rx="16" fill="url(#grid)"/>
