<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title description">
<title id="title">Eng. Hadi Al-Drobi — ERP, Finance and Engineering</title>
<desc id="description">Professional navy digital banner with an animated programming terminal, subtle circuit traces, and engineering credentials.</desc>
<defs>
  <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071522"/><stop offset=".55" stop-color="#102D44"/><stop offset="1" stop-color="#091B2B"/>
  </linearGradient>
  <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#54A2CC"/><stop offset=".5" stop-color="#B8EAFD"/><stop offset="1" stop-color="#54A2CC"/>
  </linearGradient>
  <pattern id="technical-grid" width="38" height="38" patternUnits="userSpaceOnUse">
