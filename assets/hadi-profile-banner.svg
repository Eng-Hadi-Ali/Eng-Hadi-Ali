<text x="109" y="81" fill="#BFDEED" font-family="monospace" font-size="12">hadi@engineering: ~/projects</text>
<g font-family="monospace" font-size="16">
  <text x="68" y="130" fill="#A8E8FA" clip-path="url(#type-one)">const expert = 'Odoo ERP';</text>
  <text x="68" y="168" fill="#D4EAF6" clip-path="url(#type-two)">finance.validate(ledger);</text>
  <text x="68" y="206" fill="#A8E8FA" clip-path="url(#type-three)">await automate(workflows);</text>
  <text x="68" y="254" fill="#8DDBB3" font-size="14">● ENGINEERING IN PROGRESS</text>
</g>
